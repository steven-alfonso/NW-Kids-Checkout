# Continuous integration for the Go app and the frontend test suite.
#
# Run `go test` directly rather than through `make test`. The Makefile wraps
# every target in `go tool godotenv`, and godotenv exits non-zero when .env is
# absent -- which it always is on a fresh CI checkout, since .env is gitignored.
# No test actually reads a real .env: the ones that care about an environment
# variable set it themselves with t.Setenv. Verified by removing .env and
# running `go test ./...` locally: green.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-progress run of the same ref, and any push to a
# PR branch supersedes it regardless of branch protection settings.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # go-version-file reads the `go` directive from go.mod, so this tracks the
      # module instead of a version repeated in two places that can drift.
      #
      # It must stay equal to the golang: line in Dockerfile and
      # Dockerfile.debian, both of which pin 1.27. Those image tags carry no
      # patch component, so production builds always use the newest 1.27.x while
      # this resolves the newest 1.27.x too -- but nothing enforces the two
      # agreeing. There is no matrix here on purpose: CI should test the version
      # that actually ships, not a range around it.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Caches both the module downloads and the build cache. This is the
          # single biggest win in the job: without it every run re-downloads the
          # whole module graph and rebuilds mattn/go-sqlite3 from source, which
          # is a cgo package and is slow to compile.
          cache: true
          # setup-go keys the cache on go.mod alone by default. go.sum is the file
          # that actually records which versions were resolved, so key on it.
          # No commit in this repo's history has changed go.sum without also
          # changing go.mod, so this is not fixing an observed problem -- it is
          # just the more accurate key, and it costs nothing.
          cache-dependency-path: go.sum

      # mattn/go-sqlite3 is a cgo package, so a C compiler is required. Ubuntu
      # runners include gcc, and CGO_ENABLED is 1 by default where a compiler
      # is present, so this is stated explicitly to keep the job honest if that
      # default ever changes.
      - name: Show the build environment
        run: |
          go version
          go env CGO_ENABLED CC
          gcc --version | head -1

      - name: Verify gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on these files:"
            echo "$unformatted"
            echo "Run: gofmt -w ."
            exit 1
          fi

      - name: go vet
        # Both tag sets: the dev-tagged packages are skipped entirely without
        # -tags dev, so a vet pass without them inspects strictly less.
        run: |
          go vet ./...
          go vet -tags dev ./...

      - name: Test
        run: go test ./...

      - name: Test with the dev build tag
        run: go test -tags dev ./...

      # TEMPORARY: these two are non-blocking, and should be made required once
      # the db-file branch merges.
      #
      # -trimpath is here for the same reason the Go version is not pinned in
      # this file: it tests how the shipped binary is actually built. Once the
      # db-file branch merges, db/structure.sql is read from disk and located
      # via runtime.Caller, which -trimpath rewrites to a module-relative path.
      # Resolution that works in a normal build can then fail in a trimmed one,
      # and a plain `go test ./...` cannot see it.
      #
      # Until that merge they fail for an unrelated, pre-existing reason:
      # main's internal/web/static.DevAssetsDir resolves its path from
      # runtime.Caller without verifying the result, so TestReadDevAsset cannot
      # find internal/web/dev-assets/preview.js. Reproduced on main --
      # `go test ./...` passes, `go test -trimpath ./...` fails.
      #
      # main's internal/web/static.DevAssetsDir resolves its path from
      # runtime.Caller without verifying the result, and -trimpath rewrites that
      # to a module-relative path, so TestReadDevAsset cannot find
      # internal/web/dev-assets/preview.js. Reproduced on main: `go test
      # ./...` passes and `go test -trimpath ./...` fails. The db-file branch
      # verifies the candidate and falls back to walking up from the working
      # directory, which fixes it.
      #
      # continue-on-error keeps a known failure from blocking every other PR
      # while still surfacing it. Remove these flags in that PR.
      - name: Test with -trimpath
        continue-on-error: true
        run: go test -trimpath ./...

      - name: Test with -trimpath and the dev build tag
        continue-on-error: true
        run: go test -trimpath -tags dev ./...

      # Builds the binary, which is what the release Dockerfile does. Catches a
      # broken //go:embed or an asset pipeline that has fallen behind the
      # classes the templates use.
      #
      # The Dockerfile's builder stage builds main.go directly rather than
      # ./..., because ./... would also compile the dev-only cmd/random-data
      # helper. This does the same, so a failure here is a failure in the
      # artifact that ships.
      - name: Build
        run: go build -o /dev/null main.go

  js:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Neither Dockerfile installs Node, so the frontend suite is the only
      # thing pinning a Node version and package.json declares no engines field.
      # 22 is the current LTS line.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # package-lock.json is gitignored, so `npm ci` cannot be used: there is no
      # lockfile to install from. `npm install` resolves fresh each run, which
      # also means this job can break on an upstream release. That is worth
      # knowing -- committing the lockfile would fix both, and is a separate
      # change from adding CI.
      #
      # That same missing lockfile is why there is no `cache: npm` here. npm
      # caching needs a lockfile to key on, and setup-node fails outright when it
      # cannot find one. Caching ~/.npm directly by hand would key on something
      # weaker than a lockfile while still restoring a resolved tree, which is a
      # worse trade than a 68MB install. Commit the lockfile first, then add
      # cache: npm.
      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test
