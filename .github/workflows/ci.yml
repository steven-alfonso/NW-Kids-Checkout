# Continuous integration for the Go app and the frontend test suite.
#
# Run `go test` directly rather than through `make test`. The Makefile wraps
# every target in `go tool godotenv`, and godotenv exits non-zero when .env is
# absent -- which it always is on a fresh CI checkout, since .env is gitignored.
# No test actually reads a real .env: the ones that care about an environment
# variable set it themselves with t.Setenv. Verified by removing .env and
# running `go test ./...` locally: green.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-progress run of the same ref, and any push to a
# PR branch supersedes it regardless of branch protection settings.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # go-version-file reads the `go` directive from go.mod, so this tracks the
      # module instead of a version repeated in two places that can drift.
      #
      # The Dockerfiles use the floating 1.27 tag, so production builds always
      # get the newest 1.27.x patch. go.mod requires 1.27.3, which carries the
      # latest security fixes; setup-go installs exactly that version here.
      # There is no matrix on purpose: CI should test the version that actually
      # ships, not a range around it.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Caches both the module downloads and the build cache. This is the
          # single biggest win in the job: without it every run re-downloads the
          # whole module graph and rebuilds mattn/go-sqlite3 from source, which
          # is a cgo package and is slow to compile.
          cache: true
          # setup-go keys the cache on go.mod alone by default. go.sum is the file
          # that actually records which versions were resolved, so key on it.
          # No commit in this repo's history has changed go.sum without also
          # changing go.mod, so this is not fixing an observed problem -- it is
          # just the more accurate key, and it costs nothing.
          cache-dependency-path: go.sum

      # mattn/go-sqlite3 is a cgo package, so a C compiler is required. Ubuntu
      # runners include gcc, and CGO_ENABLED is 1 by default where a compiler
      # is present, so this is stated explicitly to keep the job honest if that
      # default ever changes.
      - name: Show the build environment
        run: |
          go version
          go env CGO_ENABLED CC
          gcc --version | head -1

      - name: Verify gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on these files:"
            echo "$unformatted"
            echo "Run: gofmt -w ."
            exit 1
          fi

      - name: go vet
        # Both tag sets: the dev-tagged packages are skipped entirely without
        # -tags dev, so a vet pass without them inspects strictly less.
        run: |
          go vet ./...
          go vet -tags dev ./...

      - name: Test
        run: go test ./...

      - name: Test with the dev build tag
        run: go test -tags dev ./...

      # -trimpath is here for the same reason the Go version is not pinned in
      # this file: it tests how the shipped binary is actually built. It needs
      # its own pass because a plain `go test ./...` cannot see this class of
      # failure at all.
      #
      # These two steps were non-blocking while they were red. They caught a real
      # bug: TestReadDevAsset could not find dev-assets/preview.js, because
      # DevAssetsDir trusted runtime.Caller without verifying the result and
      # -trimpath rewrites that to a module-relative path. DevAssetsDir now
      # verifies the candidate and falls back to walking up from the working
      # directory, so these are required again.
      - name: Test with -trimpath
        run: go test -trimpath ./...

      - name: Test with -trimpath and the dev build tag
        run: go test -trimpath -tags dev ./...

      # Builds the binary, which is what the release Dockerfile does. Catches a
      # broken //go:embed or an asset pipeline that has fallen behind the
      # classes the templates use.
      #
      # The Dockerfile's builder stage builds main.go directly rather than
      # ./..., because ./... would also compile the dev-only cmd/randomdata
      # helper. This does the same, so a failure here is a failure in the
      # artifact that ships.
      - name: Build
        run: go build -o /dev/null main.go

  js:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Neither Dockerfile installs Node, so the frontend suite is the only
      # thing pinning a Node version. jsdom 30 declares the narrowest engine
      # range in the toolchain, and package.json mirrors it; 22 is the current
      # LTS line and satisfies it.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # package-lock.json is committed, so npm ci installs the exact tree the
      # local and CI runs use. That matters for the Tailwind byte-for-byte
      # check below and for the pinned Playwright browser version.
      - name: Install dependencies
        run: npm ci

      # The CSS that ships is the committed file: nothing in the Dockerfiles or
      # cmd/assets regenerates it, and no test reads it, so a page can gain
      # utility classes that are simply absent from production. That exact bug
      # shipped. Rebuilding here fails the job when the two disagree.
      #
      # Sources are pinned in internal/web/tailwind.input.css, so test-support,
      # docs, and other non-page files cannot change the generated CSS.
      #
      # Byte-for-byte, which is why package.json pins both Tailwind packages to
      # exact versions and package-lock.json is committed. An unpinned install
      # floats to the latest 4.x, and a release changes both the banner and the
      # emitted rules (4.3.x turned calc(var(--spacing) * 0) into 0). Pinned,
      # this step fails on real source drift instead of someone else's install.
      - name: Verify Tailwind output is current
        run: |
          npm run build:css > /dev/null
          if ! git diff --quiet -- internal/web/static/css/tailwind.css; then
            echo "::error::internal/web/static/css/tailwind.css is stale"
            echo "Run: npm run build:css from a clean tree."
            git diff --stat -- internal/web/static/css/tailwind.css
            exit 1
          fi

      # The checkouts page ships a committed Vite bundle. Docker has no Node
      # stage, so a stale dist would ship old code with no build error. Rebuild
      # and fail on any changed or untracked output, the same way the Tailwind
      # check above works.
      - name: Verify checkouts bundle is current
        run: |
          npm run build:checkouts-vue > /dev/null
          if [ -n "$(git status --porcelain -- internal/web/static/dist/vue)" ]; then
            echo "::error::internal/web/static/dist/vue is stale"
            echo "Run: npm run build:checkouts-vue from a clean tree."
            git status --short -- internal/web/static/dist/vue
            exit 1
          fi

      - name: Test
        run: npm test

  conformance:
    name: Checkouts conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The conformance suite serves internal/web/static directly, so it must
      # run against a bundle built from the current source, not a stale commit.
      - name: Build checkouts bundle
        run: npm run build:checkouts-vue

      - name: Run conformance suite
        run: npm run test:conformance

      - name: Run app contract suite
        run: npm run test:app

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-conformance
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
