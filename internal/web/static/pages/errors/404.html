<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NW Kids - Page Not Found</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/static/css/tailwind.css?v=dev">

    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen bg-white">
    <div class="fixed inset-0 z-0 overflow-hidden">
        <img src="/static/img/bg-left.svg" alt="" class="absolute left-0 bottom-0 h-[300px] w-auto m:h-auto object-cover object-bottom lg:h-auto lg:w-[100%] z-10">
        <img src="/static/img/bg-right.svg" alt="" class="absolute right-0 bottom-0 h-[200px] w-auto m:h-auto object-cover object-bottom lg:h-auto lg:w-[40%] z-0">
    </div>

    <div class="relative z-10 min-h-screen flex items-center justify-center px-6">
        <div class="w-full max-w-lg bg-white rounded-lg shadow-[0_0_10px_rgba(0,0,0,0.2)] border border-gray-200 p-8 text-center">
            <a href="/" class="inline-flex">
                <picture>
                  <source type="image/avif" srcset="/static/img/NWKids-logo-320.avif">
                  <source type="image/webp" srcset="/static/img/NWKids-logo-320.webp">
                  <img src="/static/img/NWKids-logo-320.png" alt="NWKids Logo" class="h-20 w-auto mx-auto">
                </picture>
            </a>
            <h1 class="text-2xl md:text-3xl font-bold text-gray-800 mt-4">Page not found</h1>
            <p class="text-sm text-gray-500 mt-2">The page you requested does not exist or has moved.</p>
            <div class="mt-6">
                <a href="/" class="inline-flex items-center justify-center rounded-md bg-blue-600 px-4 py-2 text-white font-semibold shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-200">
                    Return home
                </a>
            </div>
        </div>
    </div>
</body>
</html>
