<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NW Kids - Planning Center Events</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico"/>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
    <link rel="manifest" href="/manifest.webmanifest"/>
    <link rel="stylesheet" href="/static/css/tailwind.css?v=dev">
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
<div class="max-w-6xl mx-auto px-6 py-10">
    <header class="flex flex-col gap-2 mb-8">
        <div class="flex items-center gap-3">
            <a href="/admin">
                <picture>
                  <source type="image/avif" srcset="/static/img/NWKids-logo-320.avif">
                  <source type="image/webp" srcset="/static/img/NWKids-logo-320.webp">
                  <img src="/static/img/NWKids-logo-320.png" alt="NWKids Logo" class="h-16 md:h-24 w-auto">
                </picture>
            </a>
            <div>
                <h1 class="text-3xl font-semibold">Planning Center Events</h1>
                <p class="text-sm text-slate-600">Select an event to view available locations.</p>
            </div>
        </div>
    </header>

    <div id="page-status" class="hidden mb-4 rounded-md border border-slate-200 bg-white px-4 py-3 text-sm"></div>

    <div class="rounded-xl border border-slate-200 bg-white shadow-sm">
        <table class="min-w-full text-sm">
            <thead class="sticky top-0 z-10 bg-slate-100 text-left text-xs uppercase tracking-wide text-slate-600 shadow-sm">
            <tr>
                <th class="px-4 py-3">Event</th>
                <th class="px-4 py-3">Planning Center ID</th>
                <th class="px-4 py-3">Action</th>
            </tr>
            </thead>
            <tbody id="events-body" class="divide-y divide-slate-100">
            <tr>
                <td class="px-4 py-6 text-center text-slate-500" colspan="3">Loading events...</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-6 flex flex-wrap items-center justify-between gap-3 text-sm">
        <button id="prev-page" class="inline-flex items-center gap-2 rounded-md border border-slate-300 bg-white px-3 py-2 font-semibold text-slate-600 shadow-sm transition hover:border-slate-400 hover:text-slate-900 disabled:cursor-not-allowed disabled:opacity-50" type="button" disabled>
            <span aria-hidden="true">←</span>
            Previous
        </button>
        <button id="next-page" class="inline-flex items-center gap-2 rounded-md border border-emerald-200 bg-emerald-50 px-3 py-2 font-semibold text-emerald-700 shadow-sm transition hover:border-emerald-300 hover:text-emerald-900 disabled:cursor-not-allowed disabled:opacity-50" type="button" disabled>
            Next
            <span aria-hidden="true">→</span>
        </button>
    </div>

    <div class="mt-10">
        <a href="/admin" class="inline-flex items-center gap-2 text-sm font-semibold text-slate-600 hover:text-slate-900">
            <span aria-hidden="true">←</span>
            Back to admin
        </a>
    </div>
</div>

<script src="/static/pages/admin/planningcenter-events.js?v=dev"></script>
</body>
</html>
