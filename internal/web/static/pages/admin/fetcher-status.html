<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NW Kids - Fetcher Status</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico"/>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
    <link rel="manifest" href="/manifest.webmanifest"/>
    <link rel="stylesheet" href="/static/css/tailwind.css?v=dev">
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
<div class="max-w-6xl mx-auto px-6 py-10">
    <header class="flex flex-col gap-2 mb-8">
        <div class="flex items-center gap-3">
            <a href="/admin">
                <picture>
                  <source type="image/avif" srcset="/static/img/NWKids-logo-320.avif">
                  <source type="image/webp" srcset="/static/img/NWKids-logo-320.webp">
                  <img src="/static/img/NWKids-logo-320.png" alt="NWKids Logo" class="h-16 md:h-24 w-auto">
                </picture>
            </a>
            <h1 class="text-3xl font-semibold">Fetcher Status</h1>
        </div>
        <p class="text-sm text-slate-600">How long since each event's checkouts were last fetched.</p>
    </header>

    <div id="page-status" class="hidden mb-4 rounded-md border border-slate-200 bg-white px-4 py-3 text-sm"></div>
    <div id="fetcher-status-error" class="hidden mb-4 rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"></div>

    <div class="rounded-xl border border-slate-200 bg-white shadow-sm">
        <table class="min-w-full text-sm">
            <thead class="sticky top-0 z-10 bg-slate-100 text-left text-xs uppercase tracking-wide text-slate-600 shadow-sm">
            <tr>
                <th class="px-4 py-3">Event</th>
                <th class="px-4 py-3">Auto-fetch</th>
                <th class="px-4 py-3">Last fetched</th>
                <th class="px-4 py-3">Age</th>
            </tr>
            </thead>
            <tbody id="fetcher-status-body" class="divide-y divide-slate-100">
            <tr>
                <td class="px-4 py-6 text-center text-slate-500" colspan="4">Loading events...</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="/static/js/location-sort.js?v=dev"></script>
<script src="/static/js/check-windows.js?v=dev"></script>
<script src="/static/pages/admin/fetcher-status.js?v=dev"></script>
</body>
</html>
