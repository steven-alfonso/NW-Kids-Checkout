<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NW Kids - Login</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/static/css/tailwind.css?v=dev">

    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen bg-white">
    <!-- Background images -->
    <div class="fixed inset-0 z-0 overflow-hidden">
        <img src="/static/img/bg-left.svg" alt="" class="absolute left-0 bottom-0 h-[300px] w-auto m:h-auto object-cover object-bottom lg:h-auto lg:w-[100%] z-10">
        <img src="/static/img/bg-right.svg" alt="" class="absolute right-0 bottom-0 h-[200px] w-auto m:h-auto object-cover object-bottom lg:h-auto lg:w-[40%] z-0">
    </div>

    <div class="relative z-10 min-h-screen flex items-center justify-center px-6">
        <div class="w-full max-w-md bg-white rounded-lg shadow-[0_0_10px_rgba(0,0,0,0.2)] border border-gray-200 p-8">
            <div class="flex flex-col items-center mb-8">
                <a href="/">
                    <picture>
                      <source type="image/avif" srcset="/static/img/NWKids-logo-320.avif">
                      <source type="image/webp" srcset="/static/img/NWKids-logo-320.webp">
                      <img src="/static/img/NWKids-logo-320.png" alt="NWKids Logo" class="h-20 w-auto">
                    </picture>
                </a>
                <h1 class="text-2xl md:text-3xl font-bold text-gray-800 mt-4">Sign in to Checkout</h1>
                <p class="text-sm text-gray-500 mt-2 text-center">Use your assigned username and password.</p>
                <div id="login-error" class="mt-4 hidden w-full rounded-md border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">
                    Login failed. Please check your username and password.
                </div>
            </div>

            <form id="login-form" class="space-y-6" method="POST" action="/login">
                <div>
                    <label for="username" class="block text-sm font-semibold text-gray-700">Username</label>
                    <select
                        id="username"
                        name="username"
                        autocomplete="username"
                        required
                        class="mt-2 block w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
                    >
                        <option value="user" selected>user</option>
                        <option value="admin">admin</option>
                    </select>
                </div>

                <div>
                    <label for="password" class="block text-sm font-semibold text-gray-700">Password</label>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        required
                        class="mt-2 block w-full rounded-md border border-gray-300 px-3 py-2 text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
                    />
                </div>

                <button
                    type="submit"
                    class="w-full rounded-md bg-blue-600 px-4 py-2 text-white font-semibold shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-200 cursor-pointer"
                >
                    Log in
                </button>
            </form>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const error = params.get("error");
        if (error) {
            const banner = document.getElementById("login-error");
            if (banner) {
                banner.classList.remove("hidden");
            }
        }

        const next = params.get("next");
        if (next) {
            const form = document.getElementById("login-form");
            if (form) {
                form.action = `/login?next=${encodeURIComponent(next)}`;
            }
        }
    </script>
</body>
</html>
