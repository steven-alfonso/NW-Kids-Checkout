<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NW Kids Checkout</title>

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Tailwind CSS CDN -->
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <!-- Tailwind local -->
    <link rel="stylesheet" href="/static/css/tailwind.css?v=dev">

    <style>
        :root {
            --confirmed-filter: invert(48%) sepia(92%) saturate(453%) hue-rotate(88deg) brightness(94%) contrast(92%);
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* Hide scrollbar for Chrome, Safari and Opera */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* Hide scrollbar for IE, Edge and Firefox */
        .hide-scrollbar {
            -ms-overflow-style: none;
            /* IE and Edge */
            scrollbar-width: none;
            /* Firefox */
        }

        [data-confirmed-state="confirmed"] [data-confirmed-icon] {
            filter: var(--confirmed-filter);
        }

        #search-input::-webkit-search-cancel-button {
            cursor: pointer;
        }

        #search-controls {
            height: 0;
            min-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: height 300ms ease-out, opacity 300ms ease-out;
        }

        #search-controls .search-controls-panel {
            transform: scaleY(0);
            transform-origin: top;
            transition: transform 300ms ease-out;
        }

        #search-controls.is-expanded {
            opacity: 1;
        }

        #search-controls.is-expanded .search-controls-panel {
            transform: scaleY(1);
        }

        @keyframes new-child-flash {
            0% {
                background-color: #fef08a;
            }

            100% {
                background-color: #ffffff;
            }
        }

        .child-card-flash {
            animation: new-child-flash 3s ease-out;
        }

        #overdue-badge {
            max-width: calc(100vw - 2rem);
            white-space: nowrap;
            width: max-content;
        }

        @keyframes overdue-badge-jiggle {

            0%,
            100% {
                transform: translateX(0) scale(1);
            }

            8.33% {
                transform: translateX(-3px) scale(1.02);
            }

            16.66% {
                transform: translateX(3px) scale(1.05);
            }

            25% {
                transform: translateX(-3px) scale(1.05);
            }

            33.33% {
                transform: translateX(3px) scale(1.05);
            }

            41.66% {
                transform: translateX(-3px) scale(1.05);
            }

            50% {
                transform: translateX(3px) scale(1.05);
            }

            58.33% {
                transform: translateX(-2px) scale(1.05);
            }

            66.66% {
                transform: translateX(2px) scale(1.03);
            }

            75% {
                transform: translateX(-1px) scale(1.02);
            }

            83.33% {
                transform: translateX(1px) scale(1.01);
            }

            91.66% {
                transform: translateX(-1px) scale(1.00);
            }
        }

        .overdue-badge-jiggle {
            animation: overdue-badge-jiggle 1s ease-out;
        }

        #overdue-sheet {
            /* Height (live 80dvh) and the sync's max-height/bottom must ease
               with the slide too: at close the toolbar reappears and an
               untransitioned height snapped the drawer ~50-100px in a frame. */
            transition: translate 300ms ease-out, transform 300ms ease-out,
                height 300ms ease-out, max-height 300ms ease-out,
                bottom 300ms ease-out;
            /* dvh keeps the drawer off the whole screen where `vh` is the
               large viewport; 80vh fallback where dvh is unsupported. */
            height: 80vh;
            height: 80dvh;
            /* Also for the transition: the sync writes max-height inline, and
               a first write from `none` cannot interpolate with a length. */
            max-height: 80vh;
            max-height: 80dvh;
            /* The home indicator overlays the physical bottom edge once the
               toolbar collapses, which would bury the last row of the list.
               0 outside iOS-style notched viewports. */
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
    </style>

</head>

<body class="min-h-screen overflow-y-auto bg-white lg:h-screen lg:overflow-hidden">
    <!-- Background images -->
    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <img src="/static/img/bg-left.svg" alt=""
            class="absolute left-0 bottom-0 h-[300px] w-auto m:h-auto object-cover object-bottom lg:h-auto lg:w-[100%] z-10">
        <img src="/static/img/bg-right.svg" alt=""
            class="absolute right-0 bottom-0 h-[200px] w-auto m:h-auto object-cover object-bottom lg:h-auto lg:w-[40%] z-0">
    </div>

    <header class="relative flex justify-between items-center w-full z-20 px-6 pt-4 lg:fixed">
        <div class="flex justify-between items-center">
            <a href="/">
                <picture>
                  <source type="image/avif" srcset="/static/img/NWKids-logo-320.avif">
                  <source type="image/webp" srcset="/static/img/NWKids-logo-320.webp">
                  <img src="/static/img/NWKids-logo-320.png" alt="NWKids Logo" class="h-16 md:h-24 w-auto">
                </picture>
            </a>
        </div>

        <div
            class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-4xl md:text-6xl font-bold text-gray-800">
            <span id="current-time">14:30</span>
        </div>

        <div class="hidden lg:block w-16 md:w-24"></div>

        <div class="absolute top-6 right-6 flex items-center gap-2">
            <div id="search-toggle-host">
                <button id="search-toggle-button" type="button" disabled aria-label="Toggle search"
                    class="cursor-not-allowed rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-400 shadow-sm">
                    Search
                </button>
            </div>

            <div class="relative z-50">
                <button id="menu-button" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="kebab-menu" class="inline-flex h-11 w-11 cursor-pointer items-center justify-center rounded-full border border-slate-200 bg-white text-slate-700 shadow-sm transition hover:border-slate-300 hover:text-slate-900">
                    <span class="sr-only">Open menu</span>
                    <svg aria-hidden="true" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <rect x="3" y="4" width="14" height="2" rx="1"></rect>
                        <rect x="3" y="9" width="14" height="2" rx="1"></rect>
                        <rect x="3" y="14" width="14" height="2" rx="1"></rect>
                    </svg>
                </button>
                <div id="kebab-menu" class="absolute right-0 mt-2 hidden w-56 rounded-md border border-slate-200 bg-white py-2 text-sm text-slate-700 shadow-lg z-50">
                    <!-- kebab-menu-links -->
                </div>
            </div>
        </div>
    </header>

    <div id="checkouts-app">
        <noscript>
            <div class="text-center text-gray-600 py-8">
                This page requires JavaScript.
            </div>
        </noscript>
        <div class="text-center text-gray-500 py-8">
            Loading checkouts…
        </div>
    </div>

    <script src="/static/js/kebab-menu.js?v=dev"></script>
    <script src="/static/dist/preact/checkouts.js?v=dev"></script>
</body>

</html>
